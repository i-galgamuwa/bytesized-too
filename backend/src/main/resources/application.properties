spring.application.name=tracker
server.port=8080

# Embedded H2 file database (no install needed). Use --spring.profiles.active=postgres for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/tracker;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.mvc.problemdetails.enabled=true

# JWT signing secret (HS256, at least 32 bytes). Override with JWT_SECRET in any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-hours=12

# Tracking rules
app.timezone=Asia/Colombo
app.tracking.stale-after-minutes=5
app.tracking.max-accuracy-m=100
app.tracking.max-speed-mps=70
app.tracking.accuracy-tolerance-m=30
app.tracking.default-radius-m=100
app.tracking.retention-days=90

# OpenStreetMap Nominatim geocoding (max 1 request/second, identify the app in User-Agent)
app.geocoding.nominatim-url=https://nominatim.openstreetmap.org
app.geocoding.country-codes=lk
app.geocoding.user-agent=ByteSized-Tracker/0.1 (student project)

# Seed demo users and clients on first start
app.seed-demo-data=true
# Also generate this many days of backdated shifts, GPS trails and visits, so the
# reporting screens have realistic data on a fresh database. Set to 0 to disable.
app.seed-demo-activity-days=21
